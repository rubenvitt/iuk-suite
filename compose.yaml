services:
  suite:
    # ALS VARIABLE MIT VORBELEGUNG, und der Doppelpunkt in `:-` ist tragend — dieselbe
    # Falle wie beim clamav-Image weiter unten: ohne ihn setzt Compose eine nicht
    # gesetzte Variable auf den LEEREN String, und ein leerer `image:`-Wert lässt
    # `docker compose config` scheitern.
    #
    # WOZU DIE VARIABLE: `scripts/deploy.sh` trägt in die `.env` des Servers den DIGEST
    # des ausgerollten Standes ein, statt sich auf `:latest` zu verlassen. Zwei Dinge
    # hängen daran, die ein wanderndes Tag nicht kann:
    #   * Ein späteres `docker compose up -d` von Hand zieht denselben Stand — nicht
    #     still den nächsten, der inzwischen nach `:latest` gebaut wurde.
    #   * Der Rollback ist derselbe Handgriff mit dem vorherigen Digest, kein zweiter
    #     Mechanismus (`docs/runbooks/auto-rollout.md`, Teil D).
    # Ohne gesetzte Variable bleibt alles wie zuvor: `:latest`.
    image: ${SUITE_IMAGE:-ghcr.io/rubenvitt/iuk-suite:latest}
    restart: unless-stopped
    # Die GEMEINSAME GID von Suite-Prozess und clamd — als Variable, weil der richtige
    # Wert am clamav-IMAGE haengt, und das ist weiter unten aus genau demselben Grund
    # bereits eine Variable (`SUITE_CLAMAV_IMAGE`). Die beiden Zeilen gehoeren zusammen.
    #
    # `_lib/storage.ts` schreibt Blobs 0o640 und Ablagen 0o750 und setzt darauf, dass
    # Suite-Prozess und clamd eine gemeinsame gid haben — die Datei nennt das ausdruecklich
    # als die geltende der beiden zugelassenen Varianten ("0o640 plus gemeinsame gid").
    # Nur stellte diese Vorlage sie bisher NIRGENDS her, und ihre Annahme trifft auf einem
    # arm64-Host nicht zu (gemessen am 2026-08-02 beim files-Cutover):
    #   angenommen: Suite 1001:1001,          clamd 100:101   (clamav/clamav, alpine)
    #   gemessen  : Suite 1001:65533(nogroup), clamd 1000:1000 (clamav/clamav-debian)
    # Im Suite-Image ist `nodejs` gid 1001 und `nogroup` gid 65533 — mit clamds gid 1000
    # deckt sich keine davon. Auf so einem Host gehoert `SUITE_USER=1001:1000` in die
    # `.env`: die uid bleibt 1001(nextjs), fuer vorhandene Daten greifen also weiter die
    # Owner-Rechte; neu geschriebene Blobs bekommen Gruppe 1000 und werden damit fuer
    # clamd ueber das Gruppenbit lesbar.
    #
    # WAS OHNE DEN PASSENDEN WERT PASSIERT, und es sieht nicht nach einem Fehler aus:
    # clamd betritt die 0750-Verzeichnisse nicht, das clamav-Log meldet "File path check
    # failure: Permission denied", die App wiederholt FILES_AV_VERSUCHE-mal und setzt
    # av_status='error' — fail-closed, der Download bleibt also DAUERHAFT gesperrt.
    # `group_add` am clamav-Service loest es NICHT: clamd wechselt per `User clamav` aus
    # clamd.files.conf und verliert dabei die Zusatzgruppen.
    #
    # WARUM UEBERHAUPT EINE VARIABLE UND NICHT DER WERT: seit dem automatischen Rollout
    # vergleicht `scripts/deploy.sh` (Schritt 1) diese Datei BYTEWEISE mit der des Servers
    # und bricht bei Abweichung ab. Ein Host, der die gid anpassen muss, haette damit eine
    # dauerhaft abweichende compose.yaml — also entweder nie einen gruenen Rollout oder,
    # schlimmer, eine Angleichung an die Vorlage, die die Korrektur still herausreisst.
    # Der Ausweg aus Runbook E2 ("Zeile in die .env retten") traegt hier nicht: `user:`
    # ist ein Service-Schluessel, keine Umgebungsvariable.
    #
    # ⚠️ DIE VORBELEGUNG IST NICHT GANZ DER `USER` DES IMAGES, und der Unterschied gehoert
    # benannt statt geglaettet: `adduser --system --uid 1001 nextjs` im Dockerfile setzt
    # KEIN `-G nodejs`, `USER nextjs` laeuft also als 1001:65533(nogroup) — genau die Zahl,
    # die die Messung oben am Host zeigt. `1001:1001` aendert die Primaergruppe damit von
    # `nogroup` auf `nodejs`. Das ist unschaedlich und die bessere der beiden Zahlen: die
    # uid bleibt 1001, und `/data` samt `/data/files` gehoert im Image ohnehin
    # `nextjs:nodejs` — vorhandene Blobs traegt weiterhin das Owner-Bit. Wer den blossen
    # Ist-Zustand einfrieren will, setzt `SUITE_USER=1001:65533`; empfohlen ist das nicht,
    # denn `nogroup` als Primaergruppe ist genau der Zustand, der die gemeinsame gid
    # ueberhaupt erst verhindert hat.
    #
    # `:-` und nicht `-`, aus dem Grund, der beim Image direkt darueber steht.
    user: ${SUITE_USER:-1001:1001}
    # Reicht die .env vollständig durch — damit ist ein neuer Modul-Host
    # (SUITE_HOST_QR=…) eine Zeile in der .env und sonst nichts: kein Eingriff
    # in diese Datei, kein Commit, kein CI-Lauf.
    #
    # Bewusst NICHT als `- SUITE_HOST_PORTAL=${SUITE_HOST_PORTAL:-}` unter
    # `environment`: fehlt die Variable, setzt Compose sie auf einen LEEREN
    # String — und leer heißt „dieses Modul hat keine Prod-Domain". Das Portal
    # verschwände damit aus dem App-Switcher, sobald jemand die .env-Zeile
    # vergisst. Über env_file bleibt „nicht gesetzt" auch wirklich nicht gesetzt.
    env_file:
      # required: false -> ohne .env startet der Stack trotzdem (Registry-
      # Fallbacks greifen). Braucht Docker Compose >= 2.24.
      - path: .env
        required: false
    # `environment` gewinnt über `env_file` — die Werte hier sind fix.
    environment:
      - DATA_DIR=/data
      - AUTH_URL=${AUTH_URL:-https://iuk-ue.de}
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET must be set}
      - AUTH_TRUST_HOST=true
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-.iuk-ue.de}
      - POCKET_ID_ISSUER=${POCKET_ID_ISSUER}
      - POCKET_ID_CLIENT_ID=${POCKET_ID_CLIENT_ID}
      - POCKET_ID_CLIENT_SECRET=${POCKET_ID_CLIENT_SECRET}
      - POCKET_ID_SCOPES=${POCKET_ID_SCOPES:-openid profile email groups}
      # ADMIN_GROUP, SUITE_HOST_* und POCKET_ID_API_KEY kommen über env_file
      # (siehe oben) — nicht hier eintragen. Beim API-Key ist das mehr als
      # Konvention: ein Geheimnis gehört nicht in eine versionierte Datei, und
      # „nicht gesetzt" muss „nicht gesetzt" bleiben (das Personenverzeichnis
      # schaltet sich dann ab, statt mit leerem Key 401 zu laufen). Beim Deploy vom 19.07.2026 stellte sich heraus, dass die
      # Server-Datei ein `ADMIN_GROUP` führte, das diese Repo-Vorlage nie hatte:
      # wer sie ungeprüft übernimmt, verliert das Admin-Gating. Deshalb gilt für
      # jede Übernahme der Vorlage: vorher gegen die Server-Datei diffen.
      # Beim Cutover eines Moduls gehört zur .env-Zeile immer auch der Host in
      # der Traefik-Regel unten — sonst erreicht die Domain den Container nie.
    volumes:
      - suite_data:/data
      # Eigener Mount für die Blobs des Moduls `files`. Er leistet zwei Dinge:
      # clamd sieht die Modul-Datenbanken NICHT (portal.db, qr.db, feedback.db
      # und files.db liegen in `suite_data`), und `scripts/backup.sh` hat einen
      # benannten Anker.
      #
      # WAS ER NICHT LEISTET, und das gehört hierher: zwei benannte Volumes ohne
      # `driver_opts` liegen auf DEMSELBEN Host-Dateisystem. Ein volllaufendes
      # `files_data` erzeugt ENOSPC genau dort, wo auch die vier Modul-DBs
      # liegen. Getragen wird der Restplatz von der Ablage-Kachel (freier Platz
      # per statfs), der ENOSPC-Behandlung (507 plus gelöschte Zwischendatei)
      # und einer Quota am Blob-Ort — Letztere ist eine Betreibervorgabe, keine
      # Codeentscheidung.
      - files_data:/data/files
      # Eigener Mount fuer die Blobs des Moduls `aufgaben` (Bildnachweise, Aufgabe 19) — dasselbe
      # Muster wie `files_data` direkt darueber, aus demselben Grund: clamd soll die
      # Modul-DATENBANKEN nicht sehen (sie liegen in `suite_data`), nur die Blobs, die es scannen
      # muss. `suite_data` MITZUMOUNTEN waere die falsche Abkuerzung — der Kommentar bei Zeile 49
      # nennt den Grund (ein volllaufendes Upload-Volume erzeugte sonst ENOSPC genau dort, wo auch
      # die vier Modul-DBs liegen), und er gilt hier unveraendert. `_lib/ablage.ts`s `ablageWurzel()`
      # loest `DATA_DIR/aufgaben` auf — mit `DATA_DIR=/data` (oben) ist das exakt `/data/aufgaben`,
      # der rechte Teil dieser Zeile.
      - aufgaben_data:/data/aufgaben
    # `av` MUSS hier stehen: ohne dieses Netz erreicht die Suite clamd nicht,
    # jeder Scan läuft in ECONNREFUSED und nach FILES_AV_VERSUCHE in
    # `av_status = 'error'`. Das ist fail-closed und richtig, sieht aber wie ein
    # kaputtes Modul aus — und kein Gate außer `files/_lib/compose.test.ts`
    # berührt diese Zeile, weil E2E kein Compose benutzt.
    networks: [proxy, av]
    # Betreiberentscheidung MIT Kehrseite, und die gehört benannt: wird clamav
    # nicht healthy (fehlgeschlagener freshclam-Erststart, zu knappe
    # `start_period`, RAM-Mangel), startet die Suite GAR NICHT — mit allen vier
    # Modulen. Runbook-Zeile dazu: kommt die Suite nach `up -d` nicht hoch, ist
    # `docker compose ps clamav` der erste Blick, nicht das Suite-Log.
    #
    # Was die Kopplung kauft, ist nicht „keine Ablehnungen" (Uploads würden auch
    # ohne clamd angenommen und blieben auf `scanning`), sondern „kein
    # Wartezustand direkt nach dem Start".
    depends_on:
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health/portal"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # Muss dieselben Hosts führen wie die SUITE_HOST_*-Variablen — sonst
      # erreicht die Domain den Container gar nicht erst. Ebenfalls aus der
      # .env, damit ein Cutover ohne Eingriff in diese Datei auskommt, z. B.:
      #   SUITE_TRAEFIK_RULE=Host(`iuk-ue.de`) || Host(`qr.iuk-ue.de`)
      - traefik.http.routers.iuk-suite.rule=${SUITE_TRAEFIK_RULE:-Host(`iuk-ue.de`)}
      - traefik.http.routers.iuk-suite.entrypoints=web
      - traefik.http.services.iuk-suite.loadbalancer.server.port=3000
      # ── Redirect des Alt-Hosts radio-admin.iuk-ue.de → radio.iuk-ue.de/admin ──
      # ZWEITER, EIGENER Router. `radio-admin.iuk-ue.de` gehoert AUSDRUECKLICH NICHT in
      # SUITE_TRAEFIK_RULE oben: der Host erreichte dann den Container, kein SUITE_HOST_*
      # beansprucht ihn, und `decideRoute` schreibt auf portal um
      # (`const mod = moduleForHost(host) ?? getModule("portal")`, src/core/routing.ts:79).
      # Der Alt-Host zeigte dann das PORTAL — ein funktionierender Abruf mit falschem Inhalt.
      #
      # Der Variablenname ist bewusst NICHT `SUITE_HOST_`-praefigiert: `const PREFIX =
      # "SUITE_HOST_"` (src/core/hosts.ts:20), und `validateHostConfig` bricht bei jedem
      # Namen mit diesem Praefix ab, der zu keinem Modul-Key passt. So ist die Zeile
      # boot-neutral.
      #
      # Die Vorbelegung `radio-admin.invalid` loest niemand auf; ohne sie scheitert
      # `docker compose config`, sobald die Variable fehlt.
      - traefik.http.routers.radio-admin-alt.rule=${SUITE_REDIRECT_RULE_RADIO_ADMIN:-Host(`radio-admin.invalid`)}
      # DIESELBEN Entrypoints wie der Suite-Router eine Zeile hoeher. TLS endet VOR Traefik,
      # an einem Edge-Proxy — im ganzen Compose gibt es kein `tls`- und kein
      # `certresolver`-Label. Fuehrt dieser Router einen anderen Entrypoint, antwortet
      # https://radio-admin.iuk-ue.de/ gar nicht oder mit einem Zertifikatsfehler, und die
      # Abnahme laeuft ins Leere STATT rot zu werden (⬜ N6).
      - traefik.http.routers.radio-admin-alt.entrypoints=web
      # Middleware am ROUTER, nicht am Service: am Service traefe der Redirect die Suite selbst.
      - traefik.http.routers.radio-admin-alt.middlewares=radio-admin-alt-redirect
      - traefik.http.middlewares.radio-admin-alt-redirect.redirectregex.regex=^https?://radio-admin\.iuk-ue\.de/(.*)
      # `$${1}` erreicht Traefik als `${1}`.
      # ⚠️ HIER STAND BIS ZUM 2026-08-28: „Ein einfaches `$` verschluckt Compose, und die
      # Ersetzung liefert `/admin/` fuer JEDEN Pfad … Das ist der stille Fehlfall dieses
      # Blocks." Das beschreibt AELTERE Compose-Fassungen. GEMESSEN am 2026-08-28 auf
      # Docker Compose v5.1.2, an einer Kopie dieser Datei mit einfachem `$`:
      # `docker compose config` BRICHT AB — „invalid interpolation format for
      # services.suite.labels.[]". Der Fehlfall ist hier also LAUT, nicht still.
      # ⛔ ER BLEIBT TROTZDEM UNGESEHEN, UND DAS IST DER GRUND FUER DEN TEST DANEBEN: kein
      # CI-Schritt dieses Repos ruft `docker compose config` ueberhaupt auf. Wer die Zeile
      # verdirbt, merkt es erst am Cutover-Abend — es sei denn,
      # `scripts/compose-radio-redirect.test.ts:100-113` faengt sie vorher.
      - traefik.http.middlewares.radio-admin-alt-redirect.redirectregex.replacement=https://radio.iuk-ue.de/admin/$${1}
      # 302, nie 301: ein 301 liegt im Cache jedes Telefons, das den Alt-Host je besucht hat,
      # und macht den Rueckweg praktisch unmoeglich.
      - traefik.http.middlewares.radio-admin-alt-redirect.redirectregex.permanent=false

  # Virenscanner des Moduls `files`. Gescannt wird per `zSCAN` mit einem PFAD,
  # nicht per INSTREAM — deshalb braucht clamd die Blobs als Mount und nicht nur
  # einen Socket.
  clamav:
    # ALS VARIABLE MIT VORBELEGUNG, und der Doppelpunkt in `:-` ist tragend:
    # ohne ihn setzt Compose eine nicht gesetzte Variable auf den LEEREN String,
    # und ein leerer `image:`-Wert lässt `docker compose config` scheitern.
    #
    # Warum sie überhaupt eine Variable ist: der Tag `clamav/clamav:1.4` hat nur
    # ein `linux/amd64`-Manifest. Auf arm64 bricht `docker compose up` mit „no
    # matching manifest" ab — am Zielhost, nicht in der CI. Dort gehört eine
    # `-debian`-Variante in die `.env`.
    image: ${SUITE_CLAMAV_IMAGE:-clamav/clamav:1.5}
    restart: unless-stopped
    # NUR das interne Netz, und `internal: true` ist der Kern der Abschottung:
    # clamd ist UNAUTHENTIFIZIERT und lauscht im Container auf 0.0.0.0:3310. Am
    # externen `proxy`-Netz spräche jeder fremde Container dort ohne Zugangsdaten
    # `zPING`, `zINSTREAM` und `zSCAN` — und `zSCAN` nimmt einen Pfad IM
    # clamav-Container. Dass `drop`s `dropnet` ohne `internal: true` auskommt,
    # ist nicht übertragbar: dort trägt allein das fehlende `ports:`, weil das
    # Netz nicht von außen bestückt wird.
    networks: [av]
    volumes:
      # Die nachgeladenen Signaturen überleben ein `up -d --force-recreate`.
      # Ohne dieses Volume ist die Arbeit des Erststarts jedes Mal weg und der
      # Start hängt an einer Netzverbindung.
      - clamav_db:/var/lib/clamav
      # DASSELBE benannte Volume wie unter `suite`, nur lesend. Ein anderer Name
      # hier zeigte clamd ein LEERES Verzeichnis, und er antwortete auf jeden
      # `zSCAN` mit „Can't access file ERROR" — für jede Datei.
      #
      # `suite_data` ist bewusst NICHT gemountet: die vier Modul-Datenbanken
      # gehen den Scanner nichts an.
      - files_data:/data/files:ro
      # DASSELBE benannte Volume wie unter `suite`, nur lesend (Aufgabe 19) — ohne diese Zeile sieht
      # clamd das Ablageverzeichnis von `aufgaben` gar nicht, und jeder Scan endet mit „Can't access
      # file ERROR" → dauerhaft `scan_status: 'fehler'`, nie eine Auslieferung, nie eine
      # bildpflichtige Aufgabe abgeschlossen. Lokal (Fake-clamd, kein Compose) faellt das nicht auf.
      - aufgaben_data:/data/aufgaben:ro
      # Ohne diesen Mount ist `clamd.files.conf` ein Repo-Schmuckstück und eine
      # Übergröße bleibt ein stilles `OK` (siehe Kopf der Datei).
      #
      # ⚠️ DEPLOY: `clamd.files.conf` ist damit die ZWEITE Datei, die neben dieser
      # `compose.yaml` auf dem Server liegen muss — bisher war es genau eine. Das
      # bestehende Runbook (`docs/runbooks/suite-update-webfinger.md`) beschreibt
      # nur den Umgang mit `compose.yaml` und weiß nichts von ihr. Fehlt sie, ist
      # das KEIN Konfigurationsfehler mit klarer Meldung: Docker legt an dieser
      # Stelle ein leeres VERZEICHNIS an, clamd startet ohne seine Konfiguration,
      # der Healthcheck schlägt fehl — und weil `suite` per `service_healthy` auf
      # ihn wartet, startet die ganze Suite nicht. Das Cutover-Runbook von Spec 2
      # muss sie ausdrücklich mitkopieren.
      - ./clamd.files.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      # `clamdcheck.sh` liegt im Image und spricht den `LocalSocket` aus
      # `clamd.files.conf` an — wer dort die Zeile entfernt, nimmt hier den
      # Healthcheck mit und damit den Start der ganzen Suite.
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      # Am ZIELHOST zu messen, nicht zu übernehmen: die 17 s der Analyse-Messung
      # und die 120 s aus `drop` sind beides keine Ladezeit dieses Hosts (die
      # 120 s waren dort ein gesetzter Puffer). Wegen `depends_on` begrenzt genau
      # dieser Wert, wie lange die Suite auf clamav wartet.
      start_period: ${SUITE_CLAMAV_START_PERIOD:-120s}

volumes:
  suite_data:
    name: suite_data
  files_data:
    name: files_data
  aufgaben_data:
    name: aufgaben_data
  clamav_db:
    name: clamav_db

networks:
  proxy:
    external: true
  # `internal: true` (Spec-Vorgabe) heißt in Docker BEIDE Richtungen: kein
  # Zugang von außen — das ist der Zweck, clamd ist unauthentifiziert — und
  # keine Route NACH außen.
  #
  # DIE KEHRSEITE, ausdrücklich benannt statt verschwiegen: `freshclam` erreicht
  # damit keinen Spiegel. clamd startet trotzdem, weil die Signaturen im Image
  # liegen (~110 MiB), aber sie ALTERN — sie sind so frisch wie das Image. Der
  # Sidecar ist also nur so gut wie der Takt, in dem `SUITE_CLAMAV_IMAGE`
  # gezogen wird. Wer das ändern will, braucht ein zweites Netz am
  # clamav-Service (nicht `proxy`, sondern ein eigenes ohne `internal`) — das ist
  # eine Betreiberentscheidung mit Abwägung, kein Nachtrag hier.
  av:
    internal: true
