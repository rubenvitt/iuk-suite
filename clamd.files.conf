# clamd-Konfiguration des Suite-Sidecars (Modul `files`, Spec §6.5/§6.6)
#
# WARUM ES DIESE DATEI GIBT — EIN GEMESSENER GRUND:
# Der Scan läuft per `zSCAN` mit einem PFAD (nicht per INSTREAM). Gemessen
# meldet clamd dabei eine Datei ÜBER seiner Größenkappe als `OK`, mit dem
# Protokolleintrag „AlertExceedsMax heuristic detection disabled". Wer von
# INSTREAM auf Pfad wechselt, ohne `AlertExceedsMax yes` zu setzen, tauscht
# damit einen lauten Fehler gegen ein STILLES fail-open: die größten Dateien
# wären die ungeprüften. Genau das verhindert diese Datei.
#
# WIE SIE WIRKT: `compose.yaml` mountet sie nach `/etc/clamav/clamd.conf` und
# ERSETZT damit die Datei des Images vollständig. Alles, was clamd zum Laufen
# braucht, muss deshalb hier stehen — nicht nur die drei Zeilen, um die es geht.
# Als gesetzt gemessen waren im Image: LogFile, LogTime, LocalSocket, TCPSocket
# und User. `LogFile` fehlt hier bewusst (siehe unten), die anderen vier stehen
# darunter.
#
# VERIFIKATION AM ZIELHOST (Runbook, Spec §13.3 Frage 21): `clamconf -n` im
# laufenden Sidecar zeigt, was clamd wirklich gelesen hat. Diese Datei ist die
# QUELLE der Werte, `clamconf -n` ihre Bestätigung — nicht umgekehrt.

# ── Die Größenkappe ───────────────────────────────────────────────────────────
#
# DREI ZEILEN, EIN WERT, UND DER WERT HAT EINEN NAMEN: `FILES_AV_MAX_BYTES`.
# Die App kann clamds Kappe nicht auslesen (Spec §6.6); statt sie zu raten,
# wird sie hier GESETZT. Wer `FILES_AV_MAX_BYTES` in der `.env` ändert, ändert
# diese Datei mit — sonst laufen die beiden Zahlen auseinander, und die
# Verletzung äußert sich nicht als „Datei zu groß", sondern als AV-Fehler:
# der Nutzer sucht dann in der falschen Schicht.
#
# Der Wert ist die heute in BEIDEN Alt-Anwendungen gemessen erzwungene Grenze
# von 500 MiB (`easy-filesharing/.env:16` = 524288000 mit dem Kommentar
# `# 500 MB`; `drop` rechnet `MAX_FILE_SIZE_MB=500 * 1024 * 1024` auf dieselbe
# Zahl — Analyse-Falle 22). `FILES_MAX_DATEI_BYTES` wird NICHT heruntergezogen:
# das wäre eine stille Verhaltensänderung der Portierung.
#
# ZIFFERNREIN, OHNE KÜRZEL: clamd akzeptiert auch `500M`. Analyse-Falle 22 ist
# eine Einheitenfalle (Bytes gegen Megabytes), und `FILES_AV_MAX_BYTES` trägt
# seine Einheit im Namen. Also Bytes, ausgeschrieben.
#
# PREIS, und er ist zu messen statt zu schätzen: eine Datei dieser Größe per
# `zSCAN` kostet Zeit und RAM oben auf die ~1 GB RSS der geladenen Signaturen.
# Reißt die Dauer `FILES_AV_TIMEOUT_MS`, landet jede große Datei in `error` —
# fail-closed, also dauerhaft nicht herunterladbar, obwohl nichts kaputt ist
# (Runbook, Spec §13.3 Frage 23).
MaxFileSize 524288000

# Gleicher Wert, weil beide Wege dieselbe Kappe haben müssen. `StreamMaxLength`
# betrifft INSTREAM, das der Scanner-Vertrag heute nicht benutzt — die Zeile ist
# die zweite Linie für den Fall, dass er es wieder tut.
StreamMaxLength 524288000

# MaxScanSize MUSS >= MaxFileSize sein, und das ist mit `AlertExceedsMax yes`
# nicht Kosmetik: liegt es darunter, meldet clamd JEDE große Datei als Fund
# (`Heuristics.Limits.Exceeded`). Der Nutzer liest „Virus gefunden", wo nur eine
# Grenze zu klein war. Das Image führte 400M; mit diesem Mount ist dieser Wert
# weg und es gälte sonst clamds eigene 100-MiB-Vorgabe.
MaxScanSize 524288000

# Der Grund für die ganze Datei (siehe Kopf).
#
# UND EINE PORT-ABWEICHUNG, DIE HIERHER GEHÖRT STATT IN EINE FUSSNOTE: dieser
# Schalter wirkt auf ALLE vier Scan-Grenzen — `MaxFileSize`, `MaxScanSize`,
# `MaxFiles` (Vorgabe 10000) und `MaxRecursion` (Vorgabe 17). Die ersten beiden
# sind oben gesetzt und können von einer angenommenen Datei nicht gerissen
# werden. Die beiden Zählgrenzen bleiben auf clamds Vorgaben, und damit meldet
# clamd ein Archiv mit mehr als 10000 Einträgen als `Heuristics.Limits.Exceeded`
# — der Scanner-Vertrag liest jedes ` FOUND` als `infected`, der Empfänger liest
# also „Virus gefunden" für ein sauberes Archiv.
#
# Beide Alt-Anwendungen scannten per INSTREAM OHNE `AlertExceedsMax`; solche
# Archive gehen dort heute durch. Das ist eine Verhaltensänderung der
# Portierung, und sie wird hier bewusst NICHT durch eine erfundene höhere Zahl
# geheilt: fail-open ist keine Option, und welche Entrygrenze für diesen Bestand
# richtig ist, weiß nur der Betreiber (Runbook-Frage neben §13.3/17). Wer sie
# anhebt, schreibt `MaxFiles` explizit hierher — dann steht die Zahl an einer
# Stelle und hat einen Grund daneben.
AlertExceedsMax yes

# ── Betrieb im Container ──────────────────────────────────────────────────────

# Zeigt auf das benannte Volume `clamav_db` aus `compose.yaml`. Ohne dieses
# Volume ist die Nachladearbeit des Erststarts nach jedem
# `up -d --force-recreate` weg, und der Start hängt an einer Netzverbindung.
DatabaseDirectory /var/lib/clamav

# DER PFAD DES HEALTHCHECKS. `clamdcheck.sh` spricht diesen lokalen Socket an.
# Fällt die Zeile weg, wird der Sidecar NIE healthy — und weil `suite` per
# `depends_on: service_healthy` an ihm hängt, startet dann die ganze Suite nicht,
# mit allen vier Modulen.
LocalSocket /tmp/clamd.sock

# Der Weg, den die Suite selbst nimmt (`FILES_AV_HOST`/`FILES_AV_PORT`,
# Vorbelegung `clamav:3310`). `TCPAddr` bleibt ungesetzt, clamd lauscht also auf
# allen Interfaces des Containers — die Abschottung leistet nicht diese Datei,
# sondern `internal: true` am Netz `av`: clamd ist unauthentifiziert.
TCPSocket 3310

# Im Image gehören die Signaturdateien uid 100 / gid 101 (`clamav`); der
# Suite-Prozess läuft als uid 1001. Ob clamd die von der Suite geschriebenen
# Blobs LESEN kann, ist am Schreibtisch nicht messbar und ein Runbook-Schritt
# (Spec §13.3 Frage 16): entweder `0o640` plus gemeinsame gid, oder ein `user:`
# am clamav-Service.
User clamav

# clamd bleibt im Vordergrund, damit der Container-Prozess clamd IST (und
# `restart: unless-stopped` überhaupt etwas zu beobachten hat).
Foreground yes

# `LogFile` fehlt bewusst, obwohl das Image es setzte: ohne Datei schreibt clamd
# auf die Konsole, und dort schaut `docker compose logs clamav` hin — der erste
# Blick, wenn die Suite nach `up -d` nicht hochkommt. Ein LogFile-Pfad, dessen
# Verzeichnis im Container nicht schreibbar ist, würde clamd dagegen beim Start
# abbrechen und damit die ganze Suite unten halten.
LogTime yes
LogClean no
LogSyslog no
