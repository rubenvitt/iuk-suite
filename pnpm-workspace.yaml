# Die Desktop-App des Einsatzbuchs ist ein eigenes Workspace-Mitglied (Spec §2.2); die Suite
# bleibt das Root-Paket. `apps` fehlt im Docker-Kontext (`.dockerignore`) — wie die deps-Stage
# damit umgeht, hält `src/docker-kontext.test.ts` fest.
packages:
  - "apps/*"
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
# ⛔ VIER ECKEN, NICHT DREI: der Eintrag unter `patchedDependencies`, die Datei unter
# `patches/` UND die Zeile `COPY patches ./patches` in der deps-Stage des Dockerfiles.
# `src/docker-kontext.test.ts` haelt sie zusammen; ein Upgrade des Pakets faellt pnpm selbst
# auf (ERR_PNPM_UNUSED_PATCH).
# Der fruehere Patch an `@rc-component/util` (`useDelayState` raeumte beim Unmount seinen
# `setTimeout` nicht ab) ist seit 1.14.1 upstream (antd 6.7.1) und entfallen.
# `src/rc-component-util.test.tsx` misst die WIRKUNG weiter ueber antds eigene Aufloesung.
#
# Der Patch an next (DRK-481): nach dem Proxy tauscht Next den Koerper jeder POST-Anfrage gegen
# einen Puffer und kopiert dabei dessen `_destroy`/`_events` auf die IncomingMessage. Bricht der
# Client ab, bevor die Route den Koerper gelesen und geantwortet hat, wird `aborted` (ECONNRESET)
# so zur uncaughtException, und der Netzhaken (`core/av/scanner`) beendet die ganze Suite —
# gemessen gegen den gebauten Stand: zwei POSTs mit RST auf `/` genuegten, ohne Anmeldung. Der
# Patch haengt einen leeren `error`-Zuhoerer an und stellt damit Nodes eigene Regel wieder her
# (ohne Zuhoerer kein `error`); wer den Koerper liest, bekommt den Fehler weiter. Bis 16.4.6
# unveraendert upstream. `src/next-anfrageabbruch.test.ts` misst die WIRKUNG in einem Kindprozess.
#
# Der Patch an @rc-component/input-number (IDA-394) setzt zwei Vorgaben fuer jedes antd-`InputNumber`
# der Suite, die antd weder hat noch ueber `ConfigProvider` setzen laesst: die Zifferntastatur am
# Telefon (`inputMode` aus `precision`/`step`/`min`) und das Komma als Dezimaltrenner (ohne wurde
# „231,5" still 2315). Damit braucht kein Modul etwas dafuer zu tun. Wie beim util-Patch wandert die
# Version mit antd; `src/core/formular/zahlenfelder.test.tsx` misst die WIRKUNG ueber antd.
#
# Derselbe Patch (IDA-392) benennt die Stepper: sie heissen
# ab Werk „Increase Value"/„Decrease Value", hart kodiert in `StepHandler.js` (es/ und lib/).
# Weder antds `InputNumber` noch dessen `locale` reicht einen Namen durch, und ein eigenes
# `upHandler`-Zeichen landet nur IM benannten Element. Der Patch ersetzt die beiden Literale
# durch „Wert erhöhen"/„Wert verringern". Die Version wandert mit antd (`~1.8.0`, antd 6.7.1):
# beim antd-Upgrade nachziehen. `src/rc-component-input-number.test.tsx` misst die WIRKUNG am
# gerenderten antd-`InputNumber`.
patchedDependencies:
  '@rc-component/input-number@1.8.0': patches/@rc-component__input-number@1.8.0.patch
  next@16.4.6: patches/next@16.4.6.patch
