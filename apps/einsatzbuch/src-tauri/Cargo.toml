# Cargo-Workspace der Desktop-App. `kern` ist frei von Tauri: Vektor-, DB- und Frist-Tests
# laufen ohne `dist/` und ohne Webview-Pakete (Lehre aus einsatztagebuch/.github/workflows/ci.yml:
# `tauri::generate_context!` bricht ohne Frontend-Bau schon beim Kompilieren). Das Paket an der
# Wurzel ist die Tauri-Hülle; sie braucht `../dist` (`pnpm build`) vor dem ersten `cargo build`.
[workspace]
resolver = "3"
members = [".", "kern"]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[package]
name = "einsatzbuch"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "einsatzbuch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
einsatzbuch-kern = { path = "kern" }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# HTTP zur Suite (Entscheidung 8): ohne Default-Features, denn die bringen rustls und damit
# `ring` mit. `native-tls` nimmt die TLS-Implementierung des Betriebssystems (Schannel unter
# Windows, Security.framework unter macOS). Kein rustls, kein `ring`, kein `aws-lc` — die CI
# prüft das Lockfile (Schritt „Kein ring“).
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
# Sitzungstoken im Speicher: wird beim Verwerfen überschrieben (Sperren heißt abmelden).
zeroize = "1"

# Schlüsselbund nur, wo die App ausgeliefert wird (Entscheidung 8). `keyring` 3, nicht 4: Die 4
# verlangt Rust 1.88 (Workspace: 1.85), und nur die 3 kennt `apple-native`/`windows-native`.
# Unter anderen Zielen hält `schluesselbund.rs` das Token im Speicher und warnt.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
# Nur für die Fake-Suite der Wiederherstellungstests (`sicherung.rs`): Sie packt die Umschläge mit
# dem privaten Vektor-Schlüssel aus, wie die echte Suite bei der Freigabe. Dieselben Versionen
# wie im Kern, also keine neuen Pakete im Lockfile (und weiter kein `ring`).
p256 = { version = "0.14", features = ["ecdh"] }
hkdf = "0.13"
sha2 = "0.11"
aes-gcm = "0.11"
base64 = "0.23"
