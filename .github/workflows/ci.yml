name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Ein E2E-Fehlschlag, der lokal nicht faellt, braucht zum Nachstellen genau die
  # Bedingung, die ihn ausloest: kaltes `.next` auf einem kleinen Runner (siehe
  # den Kommentar an `retries` in `playwright.config.ts`). Ohne
  # diesen Ausloeser geht das nur ueber einen Push auf `main` oder einen offenen
  # PR — ein blosser Branch-Push startet gar nichts.
  #
  # ⚠️ WIRKT ERST NACH DEM MERGE, UND ZWAR NUR HIER NACH VORNE: GitHub bietet
  # `workflow_dispatch` ausschliesslich an, wenn der Ausloeser im Workflow des
  # DEFAULT-BRANCHES steht — auf dem Zweig, der ihn einfuehrt, ist er noch nicht
  # aufrufbar (nachgeprueft am 2026-08-14: `gh workflow run ci.yml --ref <zweig>`
  # antwortet HTTP 422). Fuer die Untersuchung, die ihn veranlasst hat, traegt
  # deshalb der `pull_request`-Ausloeser oben; der Nutzen liegt bei der naechsten.
  workflow_dispatch:

# Kleinstmoegliches Recht als Vorgabe fuer den GITHUB_TOKEN. `checks`, `e2e`
# und `test` brauchen nur den Checkout und erben es damit; `build` und `merge`
# heben es fuer sich auf `packages: write` an, weil sie nach ghcr.io schreiben.
# Ohne diese Zeile gilt die Repo-Vorgabe, die je nach Einstellung Schreibrechte
# auf ALLE Bereiche mitgibt (CodeQL-Befund 5).
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # lint/typecheck/vitest hingen frueher SERIELL vor e2e im selben Job und
  # kosteten dort 4:37, ohne dass e2e etwas von ihnen braucht. Als eigener Job
  # laufen sie parallel zu den Shards; der kritische Pfad ist seither die
  # laengste Einzelspur, nicht die Summe.
  checks:
    runs-on: ubuntu-latest
    steps:
      # `lfs: true`, weil `src/lfs-medien.test.ts` den INHALT der Medien prueft und
      # nicht bloss ihre Existenz — ohne die Objekte waere er rot. Warum die Zeile
      # ueberhaupt eine Rolle spielt, steht am Checkout des build-Jobs.
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # ══ Welche Version wird dieser Stand? ══════════════════════════════════════════════
  # Regeln, Rollback ueber Versionstag und Fehlerbilder: docs/runbooks/versionierung.md
  #
  # Die Nummer folgt aus der Historie seit dem letzten Tag `vX.Y.Z` (scripts/version.mjs):
  # jeder Schritt auf `main` ist ein Sprung, der Typ der Commits (Conventional Commits)
  # entscheidet ueber Major/Minor/Patch. Deshalb `fetch-depth: 0` — eine Tiefe-1-Kopie
  # kennt weder die Tags noch die Kette dazwischen, und `git describe` wuerfe.
  #
  # BEWUSST VOR DEM BUILD UND OHNE `pnpm install`: die Nummer wandert als Build-Arg ins
  # Image (SUITE_VERSION, wie SUITE_REVISION), muss also feststehen, bevor `build`
  # laeuft. Das Skript hat keine Abhaengigkeiten, Node reicht. Auf einem PR rechnet der
  # Job dieselbe Nummer aus und schreibt sie nur in die Zusammenfassung — der Tag
  # entsteht erst im Job `release`, nach `merge`, und nur auf `main`.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.rechne.outputs.version }}
      # Der Tag, von dem aus gerechnet wurde; leer beim allerersten. `release` nutzt ihn
      # als Startpunkt der PR-Liste.
      basis: ${{ steps.rechne.outputs.basis }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: rechne
        run: node scripts/version.mjs

  # FUENF SHARDS, NICHT MEHR WORKER — und das ist keine Geschmacksfrage.
  # `playwright.config.ts` steht auf `workers: 1`, weil der Fake-clamd seine
  # Modusdatei prozessweit teilt und `FILES_AV_PARALLEL: 1` die Reihenfolge
  # festnagelt; zwei Worker auf EINER Maschine wuerden sich gegenseitig den
  # AV-Modus umschreiben. Ein Shard dagegen ist ein eigener Runner mit eigenem
  # Fake-clamd, eigenem `.data/e2e` und eigener `FAKE_CLAMD_MODUS: ok`-
  # Vorbelegung — der geteilte Zustand wird dupliziert statt geteilt. Tests
  # derselben Datei bleiben unter `--shard` beieinander, die Reihenfolge
  # innerhalb einer Spec ueberlebt also.
  #
  # WARUM FUENF UND NICHT MEHR DREI — der Grund ist ein Ausfall, keine Rechnung.
  #
  # Die alte Begruendung lautete: gemessen 211 Tests in 18:18 bei einem Worker,
  # ~90-120 s Fixkosten je Shard, 3 Shards ≈ 8 min, 4 ≈ 6,5 min, danach frisst der
  # Vorspann den Gewinn. Das ist eine Aussage ueber WANDUHRZEIT und bleibt richtig.
  # Sie war nur nie die einzige Groesse.
  #
  # Am 2026-08-28 hat sich `e2e (2)` zweimal in Folge den Dev-Server zerlegt
  # (Laeufe 33166458248 und 33170618131, jeweils Test 119 von 132,
  # `login-dev-gruppen.spec.ts:57`):
  #
  #   thread 'tokio-rt-worker' panicked at
  #   turbopack/crates/turbo-tasks-backend/src/backend/operation/mod.rs:292:17:
  #   Restore of All for task TaskId 1038233 failed in another thread: restoring failed
  #   turbo-tasks: an internal panic occurred outside the per-task panic boundary
  #   Aborting.
  #
  # Danach fielen die restlichen 15 Tests mit `ERR_CONNECTION_RESET/REFUSED` —
  # ein Bild, das nach kaputter Anmeldung aussieht und keine ist. `Restore of …`
  # ist der Rueckweg von Turbopacks Plattencache: der schnappschusst seinen
  # Aufgabengraphen nach `.next/dev/cache/turbopack` (Vorgabe `true` seit Next
  # 16.1.0), raeumt unter Speicherdruck die Kopien im Speicher weg
  # (`turbopackMemoryEviction: 'auto'`) und holt sie bei Bedarf zurueck. Je mehr
  # Routen EIN Dev-Server uebersetzt hat, desto mehr wird geraeumt und
  # zurueckgeholt — und desto oefter faellt der Wuerfel auf diesen Pfad.
  #
  # ⛔ DEN CACHE ABZUSCHALTEN IST DIE FALSCHE ABHILFE, GEMESSEN UND VERWORFEN
  # (`fb9fe44e`, zurueckgenommen in `63b5b820`). `turbopackFileSystemCacheForDev:
  # false` liess den Panic zwar verschwinden — der Shard starb dann aber bei Test
  # 82 bzw. 84 statt bei 119, weil ohne Platte NICHTS mehr zu raeumen ist und
  # alles im Speicher bleibt. „In der CI liest den Cache ohnehin niemand" gilt
  # ZWISCHEN Laeufen und nicht INNERHALB eines Laufs.
  #
  # Bleibt die Routenflaeche je Server, und die schrumpft nur ueber Shards.
  # Gezaehlt mit `playwright test --shard=n/N --list`, jeweils der schwerste:
  #
  #   3 Shards → 132 Tests: lagerbuch + files + admin + konto + launcher/keystone
  #              — die breiteste Flaeche der Suite, und genau der rote Shard
  #   4 Shards →  91 Tests: lagerbuch + qr + portal + admin — schmaler, aber
  #              `lagerbuch-hosts` (15 Einstiege x 2 Hosts) bleibt mit
  #              `lagerbuch-mobil` und `mobil-admin` zusammen: eine Verschiebung
  #   5 Shards →  87 Tests: NUR lagerbuch (+ konto-widerruf)
  #
  # Fuenf trennt die Module sauber, vier nicht. Die Wanduhr leidet nicht: der
  # kritische Pfad ist bei jeder Aufteilung der `aufgaben`-Shard (86 Tests, die
  # unter `--shard` ohnehin beieinander bleiben), nicht die Summe.
  #
  # ⚠️ KEIN TOR FINDET DEN AUSFALL, DEN DIESE ZAHL ABWEHRT. `pnpm build` faehrt
  # `next build` und haengt am ANDEREN Schalter (`…ForBuild`); `typecheck` und
  # `lint` sehen eine Zahl in einer Konfiguration; Vitest startet keinen
  # Dev-Server. Sichtbar wird es ausschliesslich in einem e2e-Lauf unter Last —
  # und dort nicht als gescheiterte Zusicherung, sondern als abgebrochene
  # Verbindung. Wer die Zahl wieder senken will, prueft zuerst, ob der
  # Restore-Pfad in einer neueren Next-Version geheilt ist (in 16.3.1 bis 16.3.3
  # steht dazu nichts).
  e2e:
    strategy:
      # Ohne das verdeckt der erste rote Shard die anderen, und man sieht nach
      # einem Fehlschlag nur einen Teil der Suite.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    steps:
      # BEWUSST OHNE `lfs: true`, anders als `checks` und `build`: kein e2e-Fall
      # sichert heute ein Bild zu, und die Objekte fuenfmal — einmal je Shard — zu
      # holen kostet ohne Gegenwert. Wer hier eine Bildzusicherung ergaenzt, ergaenzt
      # die Zeile mit; sonst laeuft sie gegen eine Zeigerdatei.
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e --shard=${{ matrix.shard }}/5
      # OHNE DIESEN SCHRITT IST DER EINZIGE BELEG EINES ROTEN E2E-LAUFS WEG.
      # Playwright legt zu jedem Fehlschlag `test-results/<test>/error-context.md`
      # an (der `ariaSnapshot` der Seite im Moment des Scheiterns) und ab dem
      # ersten Wiederholungsversuch eine `trace.zip`. Beide liegen nur im
      # Arbeitsverzeichnis des Runners und sind mit ihm verschwunden — im Log
      # steht danach nur noch die gescheiterte Zusicherung. Genau das ist am
      # 2026-08-14 passiert (Lauf 31794072467): ein Klick auf einen `next/link`
      # liess die Adresse 30 s lang unveraendert, dreimal hintereinander — die
      # zwei Wiederholungen unten fingen es also NICHT. Der unveraenderte Rerun
      # desselben Commits lief spaeter durch; die Stoerung sass im Zustand des
      # Runners, nicht im Code. Nur war das erst nach einem halben Tag
      # Ausschlussarbeit zu sehen, weil der Zustand der Seite fehlte.
      #
      # ⚠️ DER NAME MUSS DIE SHARD-NUMMER TRAGEN: `upload-artifact@v4` weist
      # einen zweiten Upload unter bereits vergebenem Namen mit HTTP 409 ab —
      # bei drei Shards waere ein fester Name also nicht nur mehrdeutig, er
      # liesse zwei der drei Uploads scheitern, und zwar in genau dem Lauf, in
      # dem man die Artefakte braucht.
      #
      # `if: failure()` und nicht `always()`: bei einem gruenen Lauf gibt es
      # nichts zu sichern. Scheitert stattdessen `playwright install` davor,
      # laeuft der Schritt zwar an, findet aber keine Dateien — dafuer
      # `if-no-files-found: ignore`, sonst faerbte er einen bereits roten Lauf
      # ein zweites Mal rot und verdeckte die eigentliche Ursache.
      - name: Playwright-Artefakte sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artefakte-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # DER NAME `test` IST VERTRAGLICH, NICHT BESCHREIBEND: das Ruleset auf `main`
  # verlangt genau diesen Status-Kontext. Wuerden `checks` und `e2e (1/3)` …
  # direkt als erforderliche Checks dienen, bliebe `test` auf ewig ausstehend
  # und JEDER Merge waere blockiert — bei gruener CI.
  #
  # `if: always()` ist Teil desselben Vertrags: ohne das wird der Job bei einem
  # roten Bedarf uebersprungen statt rot, und ein uebersprungener Pflicht-Check
  # blockiert genauso. Er muss laufen und scheitern.
  test:
    # `version` gehoert dazu, weil es der EINZIGE Weg ist, ein rotes `version` auf
    # einem PR zum Merge-Blocker zu machen: `build` wird bei rotem `version` nur
    # UEBERSPRUNGEN, und ein uebersprungener Job ist fuer das Ruleset kein Fehlschlag.
    # Ohne diese Zeile liesse sich ein Stand mergen, dessen Nummer schon vergeben ist
    # (scripts/version.mjs) — und der Fehler traefe erst den main-Lauf, samt Rollout.
    needs: [checks, e2e, version]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # `needs.e2e.result` ist nur `success`, wenn ALLE Matrix-Jobs es sind —
      # ein einzelner roter Shard reicht. Der Vergleich faengt zugleich
      # `cancelled` und `skipped` ab.
      - name: Ergebnisse der Vorstufen prüfen
        run: |
          echo "checks=${{ needs.checks.result }} e2e=${{ needs.e2e.result }} version=${{ needs.version.result }}"
          test "${{ needs.checks.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
          test "${{ needs.version.result }}" = "success"

  # Je Architektur ein Job auf NATIVEM Runner statt einem Job mit QEMU.
  # Grund: der emulierte arm64-Build kompiliert better-sqlite3 nativ und lief
  # >2,5 h ohne fertig zu werden, während amd64 49 s braucht — Prod hing dadurch
  # auf einem alten Image fest. Nebeneffekt: der image-smoke läuft jetzt auch
  # auf arm64 wirklich, vorher wurde dort nur gebaut und nie gestartet.
  build:
    # `version` dazu, weil die Nummer als Build-Arg ins Image geht (unten).
    needs: [test, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      # ⚠️ AN DIESER ZEILE HAENGEN DIE BILDER IM AUSGELIEFERTEN IMAGE.
      # Die statischen Medien unter `public/` liegen in Git LFS (`.gitattributes`:
      # *.webp, *.jpg, *.jpeg, *.png). `actions/checkout` holt LFS-Objekte NICHT von
      # sich aus (`lfs` ist per Vorgabe `false`) — ohne diese Zeile liegen im
      # Arbeitsbaum 130-Byte-ZEIGERdateien („version https://git-lfs.github.com/
      # spec/v1"), und `COPY . .` im Dockerfile legt genau die ins Image.
      #
      # DER AUSFALL IST AUF JEDER STUFE STILL: `pnpm build` baut gruen, das Image
      # startet, der Container antwortet auf `/m/uav/illustrations/1-1.webp` mit
      # HTTP 200 — nur mit Text statt WebP. Sichtbar wird es erst auf dem Geraet,
      # als kaputtes Bildsymbol. Gemeldet am 29.08.2026 fuer das Drohnentraining;
      # `public/login-bg.jpg` (Anmeldehintergrund) traf es unbemerkt genauso.
      # Deshalb prueft der image-smoke unten den INHALT einer Bildantwort und nicht
      # ihren Statuscode: der Statuscode ist in beiden Faellen 200.
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Auch im build-Job nötig: die OCI-Labels (u. a. image.revision) stecken in
      # der Config des jeweiligen Plattform-Images. `imagetools create` im merge
      # reicht sie nicht nach — ohne das hier ist `docker image inspect` nach dem
      # Pull label-los und man kann am Server nicht prüfen, welcher Commit läuft.
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build (lokal, für image-smoke)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: iuk-suite:ci
          labels: ${{ steps.meta.outputs.labels }}
          # Muss in BEIDEN build-push-Schritten stehen, nicht nur im pushenden: der
          # image-smoke unten prueft sonst ein Image, das sich vom veroeffentlichten in
          # genau der Eigenschaft unterscheidet, an der der Rollout haengt.
          # SUITE_VERSION geht denselben Weg wie SUITE_REVISION — scripts/deploy.test.ts
          # haelt beide Zeilen an beiden Stellen fest.
          build-args: |
            SUITE_REVISION=${{ github.sha }}
            SUITE_VERSION=${{ needs.version.outputs.version }}
          # Cache pro Plattform trennen, sonst überschreiben sich die beiden
          # Matrix-Jobs gegenseitig und jeder Lauf startet kalt.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: image-smoke — Health mit Host-Header und ein echtes Bild
        run: |
          docker run -d --rm --name smoke -p 3000:3000 \
            -e AUTH_SECRET=smoke -e AUTH_DEV_LOGIN=true iuk-suite:ci
          for i in $(seq 1 20); do
            if curl -fsS -H "Host: iuk-ue.de" http://127.0.0.1:3000/api/health/portal; then ok=1; break; fi
            sleep 2
          done
          # DAS EINZIGE TOR, DAS DIE MEDIEN IM AUSGELIEFERTEN IMAGE WIRKLICH SIEHT.
          # Eine LFS-Zeigerdatei wird mit HTTP 200 ausgeliefert wie ein Bild — der
          # Statuscode taugt hier also nicht, nur die Signatur der Antwort. WebP ist
          # ein RIFF-Container: Byte 0-3 „RIFF", Byte 8-11 „WEBP"; eine Zeigerdatei
          # beginnt mit „version https://git-lfs.github.com/spec/v1".
          # `/m/uav/…` ist ein interner Pfad (core/routing.ts) und geht auf jedem Host
          # nach `public/` durch — der Host-Header spielt hier keine Rolle.
          curl -fsS -H "Host: iuk-ue.de" \
            http://127.0.0.1:3000/m/uav/illustrations/1-1.webp -o /tmp/smoke.webp || bild=abruf-fehlgeschlagen
          docker logs smoke | tail -30
          docker stop smoke
          test "${ok:-0}" = "1"
          test "${bild:-ok}" = "ok"
          head -c 64 /tmp/smoke.webp | od -c | head -4
          test "$(head -c 4 /tmp/smoke.webp)" = "RIFF"
          test "$(tail -c +9 /tmp/smoke.webp | head -c 4)" = "WEBP"
      - name: Push by digest (nur main)
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Der Commit wandert ein zweites Mal ins Image — als ENV, nicht als Label.
          # Grund: ein Prozess IM Container liest seine eigenen Labels nicht, und
          # `scripts/deploy.sh` prueft nach dem Austausch genau diese Zahl ueber
          # `/api/health/portal` (src/core/version.ts).
          build-args: |
            SUITE_REVISION=${{ github.sha }}
            SUITE_VERSION=${{ needs.version.outputs.version }}
          # Ohne Tag hochladen — die Tags vergibt der merge-Job auf der
          # Manifest-Liste, sonst würde jede Plattform :latest überschreiben.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
      - name: Digest als Artefakt ablegen
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  # Führt die per-Plattform-Digests zu einer Multi-Arch-Manifest-Liste zusammen
  # und hängt erst hier die Tags (latest/sha/branch) dran.
  merge:
    needs: [build, version]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Die letzte Zeile ist das lesbare Gegenstueck zu `:sha-…` — fuer einen Rollback
          # von Hand (`SUITE_IMAGE_TAG=1.4.2`, docs/runbooks/auto-rollout.md Teil D2). Nur
          # auf main: ein Branch-Image mit Versionsnummer saehe aus wie ein Release.
          # KEIN KOMMENTAR INNERHALB DES `|`-BLOCKS: dort waere er eine Tag-Zeile.
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.version.outputs.version }},enable={{is_default_branch}}
      - name: Manifest-Liste erzeugen
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
      - name: Verify — beide Architekturen im Manifest
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} \
            --format '{{ json .Manifest }}' | jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' | sort -u | tee /tmp/platforms
          grep -q '^linux/amd64$' /tmp/platforms
          grep -q '^linux/arm64$' /tmp/platforms

  # ══ Tag und GitHub-Release ═══════════════════════════════════════════════════════════
  # Erst HIER entsteht der Tag, nicht im Job `version`: ein Tag vor dem Build stuende
  # fuer ein Image, das es bei einem roten Build nie gab. Nach `merge` ist das Image mit
  # dieser Nummer veroeffentlicht — der Tag sagt dann etwas Wahres. Dass die Nummer
  # trotzdem schon VOR dem Build feststeht, traegt scripts/version.mjs: sie folgt aus
  # der Historie, nicht aus dem Tag (Test „mit oder ohne Zwischentag dasselbe").
  #
  # DER EINZIGE JOB MIT `contents: write` — Tag und Release brauchen es, kein anderer.
  # Ein mit dem GITHUB_TOKEN gesetzter Tag stoesst KEINEN weiteren Workflow an (GitHub
  # unterdrueckt das absichtlich gegen Schleifen), also auch nicht diesen hier.
  #
  # `deploy` haengt NICHT an diesem Job: ein Fehlschlag hier (ein Tag, den ein
  # gleichzeitiger Lauf schon gesetzt hat) darf den Rollout nicht aufhalten. Er ist dann
  # rot und sichtbar; das Image traegt die Nummer trotzdem. Fehlerbilder:
  # docs/runbooks/versionierung.md, Teil F.
  release:
    needs: [merge, version]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Volle Historie, weil die Basis fuer die Release-Notizen HIER frisch gerechnet
      # wird und nicht aus dem Job `version` kommt: zwei sich ueberholende main-Laeufe
      # haetten dort dieselbe alte Basis gesehen, und der spaetere listete die PRs des
      # frueheren noch einmal. Die NUMMER dagegen kommt weiter aus `version` — sie steckt
      # schon im Image, und sie ist aus der Historie ohnehin dieselbe (Gegenprobe unten).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: frisch
        run: node scripts/version.mjs
      - name: Tag und Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          VERSION_FRISCH: ${{ steps.frisch.outputs.version }}
          BASIS: ${{ steps.frisch.outputs.basis }}
        # Keine Backticks in diesem Block: in doppelten Anfuehrungszeichen sind sie fuer
        # bash eine Kommandosubstitution (dieselbe Falle wie in scripts/deploy.sh).
        run: |
          tag="v$VERSION"
          # Gegenprobe: die Nummer folgt aus der Historie und darf sich zwischen den Jobs
          # nicht geaendert haben. Tut sie es doch, wurde zwischendurch getaggt oder
          # umgeschrieben — dann lieber rot als ein Tag, der nicht zum Image passt.
          if [ "$VERSION_FRISCH" != "$VERSION" ]; then
            echo "::error::Das Image traegt $VERSION, die Historie ergibt jetzt $VERSION_FRISCH — siehe docs/runbooks/versionierung.md, F2."
            exit 1
          fi
          # Ein Tag, der schon auf DIESEN Commit zeigt, ist kein Fehler, sondern ein
          # wiederholter Lauf (workflow_dispatch auf main, „Re-run all jobs") — dann ist
          # hier nichts zu tun, und der Lauf bleibt gruen. Zeigt er woanders hin, war ein
          # gleichzeitiger Lauf schneller oder die Historie wurde umgeschrieben: rot.
          # `^{commit}` loest einen annotierten Tag auf den Commit auf.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git fetch -q --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
            zeigt_auf="$(git rev-parse "$tag^{commit}")"
            if [ "$zeigt_auf" = "$GITHUB_SHA" ]; then
              echo "Tag $tag zeigt bereits auf $GITHUB_SHA — wiederholter Lauf, nichts zu tun."
              exit 0
            fi
            echo "::error::Tag $tag existiert bereits und zeigt auf $zeigt_auf statt auf $GITHUB_SHA — siehe docs/runbooks/versionierung.md, F2."
            exit 1
          fi
          kopf="$(printf 'Image: ghcr.io/%s:%s\nCommit: %s' "$GITHUB_REPOSITORY" "$VERSION" "$GITHUB_SHA")"
          # GitHub listet die seit dem vorigen Tag gemergten PRs. Beim ersten Tag gibt es
          # kein „seit" — eine Liste ueber die ganze Historie sagte nichts.
          if [ -n "$BASIS" ]; then
            liste="$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" \
              -f previous_tag_name="$BASIS" --jq .body)"
            notizen="$(printf '%s\n\n%s' "$kopf" "$liste")"
          else
            notizen="$(printf '%s\n\nErster Versionstag der Suite.' "$kopf")"
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$VERSION" --notes "$notizen"
          echo "Release $tag angelegt: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"

  # ══ Automatischer Rollout auf den Server ═══════════════════════════════════════════
  # Einrichtung, Freigabe, Fehlerbilder und Rollback: docs/runbooks/auto-rollout.md
  #
  # ⚠️ DER EINZIGE JOB AUF EINEM SELBST GEHOSTETEN RUNNER — und das ist eine
  # Sicherheitsaussage, keine Randnotiz: ein selbst gehosteter Runner fuehrt den Code
  # aus, der ihm zugewiesen wird, auf einer Maschine mit Docker-Socket. Drei Riegel
  # halten DIESEN Job von fremdem Code fern, und keiner davon ist entbehrlich:
  #   1. `if` unten: nur `refs/heads/main` — ein PR-Zweig erreicht diesen Job nie.
  #   2. `environment: produktion` mit Reviewer: der Job wartet auf einen Klick, und
  #      die Environment-Regel „Deployment branches: main" ist ein zweites Schloss.
  #   3. `needs: merge`: der Rollout laeuft erst, wenn Tests, E2E und beide Images
  #      durch sind.
  # Alle uebrigen Jobs bleiben auf GitHub-Runnern.
  #
  # ⚠️ WAS DIESE DREI RIEGEL NICHT LEISTEN, und der Unterschied ist der ganze Punkt:
  # sie schuetzen diesen JOB, nicht den RUNNER. Bei einem `pull_request` aus einem Fork
  # benutzt GitHub die Workflow-Datei aus dem MERGE-Stand — wer forkt, kann sich einen
  # eigenen Job mit `runs-on: [self-hosted, iuk-suite-prod]` schreiben und laeuft an
  # allem hier vorbei. Das Repo ist oeffentlich, also ist der einzige wirksame Riegel
  # eine EINSTELLUNG ausserhalb dieser Datei: Settings → Actions → General → Fork pull
  # request workflows → „Require approval for all external contributors".
  # Vollstaendig: docs/runbooks/auto-rollout.md, Teil A0.
  deploy:
    needs: merge
    # `vars.SUITE_STACK_DIR` ist zugleich der EIN-/AUSSCHALTER: solange die Variable im
    # Repo nicht existiert, wird dieser Job uebersprungen — also auch jetzt, bevor der
    # Runner am Server steht. Ohne diese Bedingung haenge jeder main-Lauf am nicht
    # vorhandenen Runner, bis GitHub ihn nach Stunden rot faerbt. Auto-Rollout wieder
    # abschalten heisst: die Variable loeschen, kein Eingriff in diese Datei.
    if: github.ref == 'refs/heads/main' && vars.SUITE_STACK_DIR != ''
    runs-on: [self-hosted, iuk-suite-prod]
    environment:
      name: produktion
      url: https://iuk-ue.de
    # Zwei Rollouts duerfen sich nicht ueberholen. `cancel-in-progress: false`, weil ein
    # ABGEBROCHENER Rollout schlimmer ist als ein spaeter: er kann zwischen Pin und
    # `up -d` stehen. Ein ueberholter Lauf endet ohnehin folgenlos und gruen als
    # UEBERHOLT — sein Commit steht dann nicht mehr auf :latest (Schritt 2 in
    # scripts/deploy.sh).
    concurrency:
      group: deploy-produktion
      cancel-in-progress: false
    permissions:
      contents: read
      # Nur lesend: der Server zieht das Image, er baut keines.
      packages: read
    steps:
      # `persist-credentials: false`: ohne das bliebe ein GitHub-Token in der
      # `.git/config` im Arbeitsverzeichnis des Runners liegen — auf einem GitHub-Runner
      # verschwindet der mit der Maschine, auf diesem hier nicht.
      #
      # `fetch-depth: 0`, und das ist kein Luxus: waehrend dieser Job auf seine Freigabe
      # wartet, kann ein NEUERER main-Merge :latest ueberschreiben. scripts/deploy.sh
      # beweist diesen Fall per `git merge-base --is-ancestor` und endet gruen als
      # UEBERHOLT statt rot — der Beweis braucht die Historie zwischen beiden Commits,
      # und eine Tiefe-1-Kopie hat sie nicht (dann bliebe jeder ueberholte Lauf rot,
      # gemessen am 2026-08-28, Lauf 33179101270). Das Nachholen des neueren Commits
      # selbst erledigt deploy.sh per `git fetch origin main` — anonym, das Repo ist
      # oeffentlich und die Zugangsdaten sind hier bewusst nicht persistiert.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # Kein dauerhaftes Zugangsdaten-Depot auf dem Server: der GITHUB_TOKEN dieses
      # Laufs reicht zum Ziehen und wird im letzten Schritt wieder entwertet.
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Rollout
        env:
          SUITE_STACK_DIR: ${{ vars.SUITE_STACK_DIR }}
          SUITE_REVISION_ERWARTET: ${{ github.sha }}
          SUITE_IMAGE_BASIS: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Beide optional; die Vorbelegungen stehen in scripts/deploy.sh.
          SUITE_HEALTH_URL: ${{ vars.SUITE_HEALTH_URL }}
          SUITE_BACKUP_CMD: ${{ vars.SUITE_BACKUP_CMD }}
        run: ./scripts/deploy.sh
      - name: ghcr-Zugangsdaten wieder entfernen
        if: always()
        run: docker logout ${{ env.REGISTRY }}
